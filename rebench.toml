[run]
timeout_s = 600
repeats = 1
results_dir = "results"
# cap every tool to N cpu cores during analysis (0 = use all cores)
threads = 0

[corpus]
dir = "corpus/binaries"
manifest = "corpus/manifest.json"
sources = "corpus/sources"

[tools.baseline]
enabled = true

[tools.r2]
enabled = true
# path = "C:\\path\\to\\r2.exe"

[tools.ghidra]
enabled = true
# install_dir = "C:\\ghidra_11.3.2_PUBLIC"
# threads = 8   # per-tool cap overrides [run] threads

[tools.ida]
enabled = true
# install_dir = "C:\\Program Files\\IDA Professional 9.2"

[tools.binaryninja]
enabled = true

[tools.angr]
enabled = true
