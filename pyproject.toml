[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebench"
version = "0.1.0"
description = "Benchmark harness for reverse-engineering tools"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "psutil>=5.9",
    "pefile>=2023.2.7",
    "pyelftools>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
tui = ["textual>=0.60"]
charts = ["matplotlib>=3.8"]
angr = ["angr>=9.2", "bitstring<5"]

[project.scripts]
rebench = "rebench.cli:main"

[tool.setuptools.packages.find]
include = ["rebench*"]

[tool.setuptools.package-data]
rebench = ["ghidra_scripts/*.py", "ida_scripts/*.py"]
